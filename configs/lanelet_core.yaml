# Minimum Viable Lanelet Core
# Single-phase fully supervised: all losses from epoch 0.
# Previous 3-phase curriculum failed with only 9 training samples.

data:
  v1_dir: "../graph_geolane"
  video_path: "./dataset/511video"
  dataset_path: "./dataset/"
  camera_locations: "./dataset/camera_location_list.txt"
  osm_path: "./dataset/sumo"
  preprocess_path: "./results/preprocess"
  detection_period: 3600

  # Image dimensions (fallback for pixel → [0,1] normalization when frame unavailable)
  # Actual frame dimensions are read at runtime from each camera's frame
  image_width: 1920
  image_height: 1080

  # Tracklet construction
  tracklet_length: 10               # was 15 — more tracklets per vehicle trajectory
  tracklet_min_points: 5
  tracklet_polyline_k: 10

  # Graph construction (normalized [0,1] pixel-space)
  edge_radius: 0.15                 # was 40.0m → ~192px / 1280
  edge_temporal_max: 30.0           # unchanged (seconds)
  edge_tangent_threshold: 0.5       # unchanged (cosine)
  max_neighbors_per_node: 30       # k-NN cap: limits edges to k nearest (was unbounded → 1.2M edges)

  # Time windowing
  time_window: 120.0                # was 60 — capture ~2x more vehicles per window
  time_window_stride: 60.0          # 50% overlap with 120s window — ~2x more samples

  # Train/Val/Test split — location-based train/val + temporal test
  # Train (9 loc): US12_Monona, US12_Park, US12_Yahara, US12_JohnNolen,
  #   US12_Todd, US12_Whitney, US12_Greenway, I43_Walnut, US12_CountyAB
  # Val (2 loc): US12_Stoughton, I43_Keefe
  # Test: held-out time windows (last 15%) from ALL cameras
  train_ratio: 0.85                                    # first 85% of time for train/val cameras
  val_ratio: 0.0                                       # val is purely location-based (no time slice)
  test_ratio: 0.15                                     # last 15% of time from ALL cameras → test
  holdout_cameras: []                                  # no holdout — all cameras contribute to test
  val_cameras: [US12_Stoughton, I43_Keefe]             # val-only cameras (location-based split)
  split_by_location: true                              # use location-based val split

  # Data augmentation (train only)
  augmentation: true              # lateral jitter ±1m, heading noise ±3°, 20% tracklet dropout

  # Direction-based graph splitting
  split_by_direction: true
  direction_min_gap_deg: 45.0

  # Lane-group-partitioned graphs
  use_lane_groups: true
  lane_group_method: "density"

  # Density contours
  use_density_contours: true
  neck_ratio: 0.4

  # Density lane grouping params
  density_sigma_along: 25.0
  density_sigma_across: 6.0
  refine_contours: true
  refine_buffer_px: 25.0

  # Fixed lane width (normalized)
  fixed_lane_width: 0.012           # was 3.5m → ~15px / 1280

  # Annotation GT (hand-drawn lane annotations)
  use_annotation_gt: true
  annotation_dir: "../dataset/preprocess"

  # SUMO matching for supervised targets
  use_sumo_targets: false
  sumo_match_radius: 0.10          # was 30.0m
  sumo_match_radius_m: 0.03        # was 8.0m
  merge_consecutive_sumo_lanes: true
  align_sumo_to_tracklets: true    # ICP alignment corrects systematic GPS offset

  # SUMO lane clipping
  clip_sumo_lanes: true
  clip_sumo_margin_m: 0.07         # was 20.0m
  min_lane_evidence: 3             # was 5 — lowered since alignment improves overlap

  # Pseudo-GT (kept for compat)
  pseudo_gt_min_gap_factor: 2.5
  use_lane_coord_labels: false

  # GT lanelet construction (v3-specific)
  lanelet_gt_waypoints_per_lane: 0    # 0 = adaptive (based on lane length)
  lanelet_gt_waypoint_spacing: 0.05   # was 15.0m → ~64px / 1280
  lanelet_adjacent_threshold: 0.02    # was 5.0m

assignment:
  lateral_threshold_px: 60.0   # max mean lateral offset in pixels to accept assignment
  lane_change_std_px: 30.0     # std(lateral) in pixels above this → flag as lane change
  min_tracklet_points: 5       # minimum points per track for reliable assignment

model:
  backbone: "gnn"                # SAGEConv only, no global attention/gating
  hidden_dim: 128
  num_layers: 3                  # was 4
  num_heads: 8
  dropout: 0.1
  polyline_k: 10
  polyline_encoder: "transformer"
  polyline_encoder_dim: 64
  polyline_encoder_layers: 2
  polyline_encoder_heads: 4

  # Lanelet pooling
  num_lanelet_nodes: 32          # over-provision: 4 lanes × ~8 nodes; confidence deactivates unused
  num_lanelet_edge_types: 5
  lanelet_assign_layers: 0       # no GATConv — just Linear projection
  lanelet_adj_threshold: 0.1
  use_edge_classifier: true      # binary successor classification
  successor_max_distance: 0.20   # was 50.0m → normalized
  successor_min_heading_cos: 0.7 # min heading cosine similarity for candidates
  successor_min_downstream: 0.004  # was 1.0m → normalized
  successor_max_lateral: 0.03    # was 8.0m → normalized
  slot_across_weight: 3.0        # lateral distance weight in slot affinity (higher = stronger lane distinction)
  density_radius: 0.05           # was 15.0m → normalized

training:
  epochs: 100
  batch_size: 1
  learning_rate: 0.001            # higher LR for small dataset
  weight_decay: 0.0005
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 15              # was 10 — longer warmup for new affinity to settle
  grad_clip_norm: 1.0
  gradient_accumulation_steps: 4
  mixed_precision: true

  # Core losses
  lanelet_position_weight: 3.0    # Hungarian-matched L1
  lanelet_confidence_weight: 2.0  # was 1.0 — increased to break confidence plateau
  lanelet_heading_weight: 1.0     # tangent alignment
  lanelet_edge_weight: 2.0        # binary successor loss
  hard_neg_k: 4                   # hard negatives per positive in successor loss

  # Coverage loss (bidirectional position: GT→pred)
  coverage_weight: 2.0            # penalize uncovered GT waypoints
  coverage_threshold: 0.03        # was 8.0m → ~38px / 1280

  # Stabilizing losses
  separation_weight: 1.0         # was 0.5 — stronger push to cover full pred_range
  assign_consistency_weight: 0.3 # same-GT-lane tracklets → same slot (KL, conf-gated)
  heading_smoothness_weight: 0.5 # penalize heading jumps along successor edges
  collinearity_weight: 0.5       # penalize zigzag lane shapes (A→B→C straightness)
  lane_cls_weight: 0.5           # cross-entropy on assignment logits (warmup-gated)
  lane_cls_warmup_epoch: 50      # only enable lane_cls after this epoch (position must converge first)

  # Disabled
  data_fit_weight: 0.0
  balancing_weight: 0.0
  pooling_entropy_weight: 0.0
  drivable_weight: 0.0
  sumo_topology_weight: 0.0
  pooling_link_weight: 0.0

  confidence_threshold: 0.3
  confidence_min_matches: 3      # skip confidence loss if fewer matches (prevents collapse)
  conf_neg_sample_ratio: 2.0     # sample 2x negatives per positive (prevents conf collapse)
  conf_soft_target_sigma: 0.02   # was 5.0m → normalized
  vis_top_k: 30                  # Top-K nodes by confidence for visualization (0=use threshold+NMS)
  val_frequency: 5
  test_frequency: 50
  checkpoint_frequency: 10
  vis_frequency: 5                # more frequent visualization
  early_stopping_patience: 60     # was 40 — longer budget with 200 epochs

system:
  device: "auto"
  num_workers: 0
  seed: 42
  pin_memory: false
  log_level: "INFO"

experiment:
  experiment_name: "lanelet_core"
  saving_path: "./results/"
  save_visualizations: true
