# Lanelet Discovery via Differentiable Graph Coarsening (v3)

data:
  v1_dir: "../graph_geolane"
  video_path: "./dataset/511video"
  dataset_path: "./dataset/"
  camera_locations: "./dataset/camera_location_list.txt"
  osm_path: "./dataset/sumo"
  preprocess_path: "./results/preprocess"
  detection_period: 3600

  # Image dimensions (fallback for pixel → [0,1] normalization when frame unavailable)
  image_width: 1920
  image_height: 1080

  # Tracklet construction
  tracklet_length: 15
  tracklet_min_points: 5
  tracklet_polyline_k: 10

  # Graph construction (normalized [0,1] pixel-space)
  edge_radius: 0.15                 # was 40.0m
  edge_temporal_max: 30.0
  edge_tangent_threshold: 0.5

  # Time windowing
  time_window: 60.0
  time_window_stride: 30.0

  # Train/Val/Test split
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  holdout_cameras: [I43_Keefe, I43_Walnut]

  # Direction-based graph splitting
  split_by_direction: true
  direction_min_gap_deg: 45.0

  # Lane-group-partitioned graphs
  use_lane_groups: true
  lane_group_method: "density"

  # Density contours
  use_density_contours: true
  neck_ratio: 0.4

  # Density lane grouping params
  density_sigma_along: 25.0
  density_sigma_across: 6.0
  refine_contours: true
  refine_buffer_px: 25.0

  # Fixed lane width (normalized)
  fixed_lane_width: 0.012           # was 3.5m

  # Annotation GT (hand-drawn lane annotations)
  use_annotation_gt: true
  annotation_dir: "../dataset/preprocess"

  # SUMO matching for supervised targets
  use_sumo_targets: false
  sumo_match_radius: 0.10
  sumo_match_radius_m: 0.03
  merge_consecutive_sumo_lanes: true

  # SUMO lane clipping
  clip_sumo_lanes: true
  clip_sumo_margin_m: 0.07
  min_lane_evidence: 5

  # Pseudo-GT (kept for compat)
  pseudo_gt_min_gap_factor: 2.5
  use_lane_coord_labels: false

  # GT lanelet construction (v3-specific)
  lanelet_gt_waypoints_per_lane: 6
  lanelet_adjacent_threshold: 0.02

model:
  backbone: "graph_transformer"
  hidden_dim: 128
  num_layers: 4
  num_heads: 8
  dropout: 0.1
  polyline_k: 10
  polyline_encoder: "transformer"
  polyline_encoder_dim: 64
  polyline_encoder_layers: 2
  polyline_encoder_heads: 4

  # Lanelet pooling
  num_lanelet_nodes: 32
  num_lanelet_edge_types: 5
  lanelet_assign_layers: 2
  lanelet_adj_threshold: 0.1

training:
  epochs: 100
  batch_size: 1
  learning_rate: 0.0003
  weight_decay: 0.0005
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 10
  grad_clip_norm: 1.0
  gradient_accumulation_steps: 4
  mixed_precision: true

  # Lanelet loss weights
  lanelet_position_weight: 5.0
  lanelet_heading_weight: 2.0
  lanelet_edge_weight: 0.5       # lowered (was 3.0) — hard multi-class; deterministic linking compensates
  lanelet_confidence_weight: 1.0

  # Regularization losses
  pooling_entropy_weight: 0.1
  balancing_weight: 1.0           # anti-collapse: uniform slot utilization (critical for M=32)
  pooling_link_weight: 0.1
  assign_consistency_weight: 0.3

  # New losses
  drivable_weight: 1.0
  data_fit_weight: 2.0
  sumo_topology_weight: 1.0
  separation_weight: 2.0          # push lanelet nodes apart (>= data_fit to overcome pull)

  # Validation
  confidence_threshold: 0.3
  val_frequency: 5
  checkpoint_frequency: 10
  vis_frequency: 10
  early_stopping_patience: 20

system:
  device: "auto"
  num_workers: 0
  seed: 42
  pin_memory: false
  log_level: "INFO"

experiment:
  experiment_name: "lanelet_discovery"
  saving_path: "./results/"
  save_visualizations: true
